<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7E22CE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Purple Arrow/Pointer - main shape -->
  <path d="M 180 40
           Q 200 35 210 50
           Q 220 70 180 120
           L 160 140
           L 140 120
           Q 170 80 175 60
           Q 180 45 180 40
           Z"
        fill="url(#purpleGrad)" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Purple Arrow - curved body -->
  <path d="M 180 40
           Q 150 30 110 50
           Q 70 75 60 120
           Q 55 145 70 160
           Q 95 150 140 120
           L 160 140
           Q 140 160 100 175
           Q 70 190 50 170
           Q 30 145 40 110
           Q 50 70 100 40
           Q 140 20 180 40
           Z"
        fill="url(#purpleGrad)" stroke="none" stroke-linejoin="round"/>

  <!-- Notch/chevron cutout in middle for visual interest -->
  <path d="M 130 110 L 150 130 L 130 150 Z"
        fill="white" stroke="none"/>

  <!-- Blue Teardrop - rounded shape at bottom -->
  <path d="M 120 160
           Q 85 155 70 180
           Q 60 200 70 220
           Q 90 235 120 230
           Q 150 225 160 200
           Q 170 175 155 160
           Q 140 150 120 160
           Z"
        fill="url(#blueGrad)" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Additional curve for teardrop shape -->
  <path d="M 120 160
           Q 100 165 95 185
           Q 92 205 105 220
           Q 125 235 140 225
           Q 155 215 160 195
           Q 165 170 150 160
           Q 135 150 120 160
           Z"
        fill="url(#blueGrad)" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
</svg>